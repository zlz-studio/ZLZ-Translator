# ============================================================
#  ไฟล์ตั้งค่าของเครื่องมือแปล (แก้แล้วรีสตาร์ทโปรแกรม)
# ============================================================

[general]
# น้ำเสียงเริ่มต้นตอนแปลไทย -> อังกฤษ : formal | friendly | brief
default_tone = "friendly"

# ลำดับผู้ให้บริการ ตัวแรกคือหลัก ถ้าล้มเหลวจะลองตัวถัดไปตามลำดับ
# ตัวเลือก: claude_code | gemini | anthropic | ollama
# ตั้ง gemini ไว้ก่อนเพราะเร็วกว่า ถ้ายังไม่ได้ใส่ GEMINI_API_KEY จะข้ามไปใช้ claude_code ให้เอง
provider_order = ["gemini", "claude_code"]

# เวลารอสูงสุดต่อการแปลหนึ่งครั้ง (วินาที)
timeout_seconds = 60

# หลังแปลไทย -> อังกฤษ ให้แปลกลับเป็นไทยอัตโนมัติเพื่อเช็กความหมายก่อนกด Enter
auto_back_translate = true

[modes]
# รุ่นโมเดลต่อโหมด (ใช้กับ claude_code และ anthropic)
# ใช้ชื่อย่อได้: haiku (เร็ว/ถูก) | sonnet (สมดุล) | opus (ดีที่สุด)
read    = "sonnet"   # อังกฤษ -> ไทย (haiku ช้าและเพี้ยนกว่า sonnet จากการวัดจริง)
reply   = "sonnet"   # ไทย -> อังกฤษ
explain = "sonnet"   # อธิบายว่าลูกค้าหมายถึงอะไร
polish  = "sonnet"   # ขัดเกลาอังกฤษที่พิมพ์เอง

# ------------------------------------------------------------
[providers.claude_code]
# เว้นว่าง = หาให้อัตโนมัติ (claude ใน PATH หรือไบนารีที่มากับแอป Claude Desktop)
# หรือระบุพาธเอง เช่น "C:/Users/Boss/AppData/Roaming/Claude/claude-code/2.1.280/claude.exe"
command = ""
# ระดับความคิด low ทำให้ตอบไวและประหยัดโควต้า
effort = "low"
# ตัดการโหลด MCP/ปลั๊กอิน/Chrome ตอนเริ่มโปรเซส ลดเวลาได้ราว 2-3 วินาทีต่อครั้ง
fast_start = true
# อาร์กิวเมนต์เพิ่มเติม ถ้าต้องการ
extra_args = []

[providers.gemini]
# ใส่คีย์ในไฟล์ .env ชื่อ GEMINI_API_KEY
model = "gemini-3.5-flash-lite"   # เร็วสุดจากการวัด (~1 วินาที) รุ่น 2.5 ปิดรับผู้ใช้ใหม่แล้ว ทางเลือก: gemini-3.6-flash (แม่นกว่า ช้ากว่า)

[providers.anthropic]
# ใส่คีย์ในไฟล์ .env ชื่อ ANTHROPIC_API_KEY (ใช้เครดิต API แยกจากโควต้าสมาชิก)
# ชื่อย่อ haiku/sonnet/opus ใน [modes] จะถูกแปลงเป็นรุ่นจริงให้
# haiku -> claude-haiku-4-5, sonnet -> claude-sonnet-5, opus -> claude-opus-5

[providers.ollama]
host = "http://localhost:11434"
model = "qwen2.5:7b"

# ------------------------------------------------------------
[hotkeys]
# ใช้ F-key เพราะไม่ขึ้นกับภาษาแป้นพิมพ์ (ไทย/อังกฤษ) และไม่ชนกับปุ่มลัดของ Discord
read = "f8"           # ลากคลุมอังกฤษ -> ป๊อปอัปไทย
reply = "f9"           # พิมพ์ไทยในช่องแชท -> แทนที่ด้วยอังกฤษ (ยังไม่ส่ง)
explain = "shift+f8"     # ลากคลุม -> อธิบายว่าลูกค้าหมายถึงอะไร
polish = "shift+f9"     # อังกฤษที่พิมพ์เองในช่องแชท -> แก้ให้ถูกและเป็นธรรมชาติ

# ให้ปุ่มลัดทำงานเฉพาะเมื่อหน้าต่างที่เปิดอยู่มีคำเหล่านี้ในชื่อ (ว่าง = ทุกโปรแกรม)
# เช่น ["Discord"] จะไม่รบกวนตอนใช้ Unity หรือ Visual Studio ที่ใช้ F8/F9 อยู่แล้ว
only_in_apps = []

[discord]
# เปิด Discord app อัตโนมัติพร้อมโปรแกรม Hotkey (ต้องมี DISCORD_TOKEN ใน .env)
# เปิด/ปิดระหว่างใช้งานได้ที่เมนูไอคอน tray
autostart = true

[ui]
# ขนาดตัวอักษรในป๊อปอัป
font_size = 11
# ป๊อปอัปปิดเองหลังกี่วินาที (0 = ไม่ปิดเอง)
auto_close_seconds = 0
